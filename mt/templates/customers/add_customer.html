{% extends "base.html" %}

{% block title %}Добавить клиента{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Добавить клиента</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
    <a href="{% url 'customer-list' %}" class="btn btn-secondary mt-2">Назад к списку</a>
</div>
{% endblock %}
