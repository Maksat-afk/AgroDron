{% extends "base.html" %}

{% block content %}
<h2>Вход</h2>
<form method="POST">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Логин" class="form-control">
    <input type="password" name="password" placeholder="Пароль" class="form-control mt-2">
    <button type="submit" class="btn btn-primary mt-2">Войти</button>
</form>
{% endblock %}
