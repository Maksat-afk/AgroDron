{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мои заметки{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'note/styles.css' %}">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm p-3 mb-4 rounded">
            <a class="navbar-brand" href="{% url 'note_list' %}">📒 Мои заметки</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="btn btn-primary" href="{% url 'note_create' %}">Добавить заметку</a>
                    </li>
                </ul>
            </div>
        </nav>

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
