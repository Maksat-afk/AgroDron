{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-success text-white">
        <h2 class="mb-0">{{ note.title }}</h2>
    </div>
    <div class="card-body">
        <p>{{ note.content }}</p>
        <small class="text-muted">Дата создания: {{ note.created_at }}</small>
        <hr>
        <a href="{% url 'note_update' note.id %}" class="btn btn-warning">✏️ Редактировать</a>
        <a href="{% url 'note_delete' note.id %}" class="btn btn-danger">🗑️ Удалить</a>
        <a href="{% url 'note_list' %}" class="btn btn-secondary">⬅️ Назад</a>
    </div>
</div>
{% endblock %}
