{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>Threads</h1>
    <ul>
        {% for thread in threads %}
        <li><a href="{% url 'thread_detail' thread.id %}">{{ thread.name }}</a></li>
        {% endfor %}
    </ul>
    <a href="{% url 'thread_create' %}" class="btn btn-primary">Create Thread</a>
</div>
{% endblock %}
