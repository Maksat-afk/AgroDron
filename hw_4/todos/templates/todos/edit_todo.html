{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1 class="text-center">Редактировать задачу</h1>

    <form method="post" class="mt-3">
        {% csrf_token %}
        {{ form.as_p }}

    </form>

    <a href="{% url 'todo_lists' %}" class="btn btn-secondary mt-3">Назад</a>
</div>
{% endblock %}
