{% extends "base.html" %}
{% block content %}
<h1 class="text-center">Todo Lists</h1>
<ul class="list-group">
    {% for list in lists %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <a href="{% url 'todo_list_detail' list.id %}">{{ list.title }}</a>
        <a href="{% url 'delete_todo_list' list.id %}" class="btn btn-danger btn-sm">Удалить</a>
    </li>
    {% endfor %}
</ul>
<form method="post" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
        {{ form.as_p }}
    </div>
    <button type="submit" class="btn btn-primary">Добавить список</button>
</form>
{% endblock %}
