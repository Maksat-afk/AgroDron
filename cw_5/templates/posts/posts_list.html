{% extends "base.html" %}

{% block content %}
    <h1 class="text-center">Список постов</h1>

    {% for post in posts %}
        <div class="card mb-3">
            <div class="card-body">
                <h2 class="card-title">{{ post.title }}</h2>
                <p class="card-text">{{ post.description }}</p>
                <p class="text-muted">Автор: {{ post.author.username }}</p>
                <a href="{% url 'post_detail' post.id %}" class="btn btn-primary">Подробнее</a>
            </div>
        </div>
    {% empty %}
        <p class="text-center text-muted">Постов пока нет.</p>
    {% endfor %}
{% endblock %}
